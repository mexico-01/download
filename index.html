<h2>Archivo listo para descargar</h2>

<p id="filename">Seleccionando archivo...</p>

<button id="download" disabled>
    Descargar ahora
</button>

<p id="status"></p>

<script>
const usuario = "mexico-01";
const repositorio = "download";
const pasta = "downloads";

let arquivoSelecionado = null;

async function selecionarArquivo() {
    const api =
        `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

    try {
        const resposta = await fetch(api);
        const arquivos = await resposta.json();

        const js = arquivos.filter(item =>
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".js")
        );

        if (!js.length) {
            document.getElementById("filename").textContent =
                "No hay archivos disponibles.";
            return;
        }

        arquivoSelecionado =
            js[Math.floor(Math.random() * js.length)];

        document.getElementById("filename").textContent =
            arquivoSelecionado.name;

        document.getElementById("download").disabled = false;

    } catch (erro) {
        document.getElementById("filename").textContent =
            "Error al cargar el archivo.";
    }
}

document.getElementById("download").addEventListener("click", async () => {

    if (!arquivoSelecionado) return;

    const status = document.getElementById("status");
    status.textContent = "Iniciando descarga...";

    const resposta = await fetch(
        arquivoSelecionado.download_url
    );

    const blob = await resposta.blob();

    const blobUrl =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = blobUrl;
    a.download =
        arquivoSelecionado.name;

    document.body.appendChild(a);

    a.click();
    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(blobUrl);
    }, 5000);

    status.textContent =
        "Descarga iniciada.";
});

selecionarArquivo();
</script>
