
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Descargar archivo</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.box {
    background: white;
    width: 420px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
    text-align: center;
}

button {
    background: #1769e0;
    color: white;
    border: 0;
    padding: 14px 28px;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

#arquivo {
    margin: 20px 0;
    background: #f1f3f5;
    padding: 12px;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="box">

<h2>Descargar archivo</h2>

<p>
Se ha seleccionado un archivo disponible.
</p>

<div id="arquivo">
Buscando archivo...
</div>

<button id="download" disabled>
Descargar
</button>

<p id="status"></p>

</div>

<script>

const usuario = "mx01";
const repositorio = "download";
const pasta = "downloads";

let arquivoSelecionado = null;

async function escolherArquivo() {

    const api =
        `https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}`;

    try {

        const resposta = await fetch(api);

        const arquivos = await resposta.json();

        const js = arquivos.filter(item =>
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".js")
        );

        if (!js.length) {

            document.getElementById("arquivo").textContent =
                "No hay archivos disponibles.";

            return;
        }

        arquivoSelecionado =
            js[Math.floor(Math.random() * js.length)];

        document.getElementById("arquivo").textContent =
            arquivoSelecionado.name;

        document.getElementById("download").disabled = false;

    } catch(e) {

        document.getElementById("arquivo").textContent =
            "Error al buscar archivos.";

    }

}

document.getElementById("download").onclick = async function() {

    if (!arquivoSelecionado)
        return;

    const status =
        document.getElementById("status");

    status.textContent =
        "Preparando descarga...";

    const resposta =
        await fetch(arquivoSelecionado.download_url);

    const blob =
        await resposta.blob();

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        arquivoSelecionado.name;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    status.textContent =
        "Descarga iniciada.";

};

escolherArquivo();

</script>

</body>
</html>
